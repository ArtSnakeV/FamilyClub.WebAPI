apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: familyclub-ingress
  namespace: production
  labels:
    app.kubernetes.io/name: familyclub-ingress
    app.kubernetes.io/part-of: familyclub
    app.kubernetes.io/component: ingress
    app.kubernetes.io/environment: production
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
