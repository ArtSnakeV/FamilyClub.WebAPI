trigger:
  - DevelopmentTesting

pool:
  vmImage: 'ubuntu-latest'

variables:
  dockerId: 'metra638'
  repoName: 'test1' 

steps:
  - script: |
      echo "$(DOCKERHUB_PASSWORD)" | docker login -u "$(DOCKERHUB_USERNAME)" --password-stdin
    displayName: 'Login to Docker Hub'
    env:
      DOCKERHUB_USERNAME: $(DOCKERHUB_USERNAME)
      DOCKERHUB_PASSWORD: $(DOCKERHUB_PASSWORD)

  - script: |
      docker run --rm -i hadolint/hadolint < dockerfile.frontend
      docker run --rm -i hadolint/hadolint < dockerfile.backend
    displayName: 'Lint Dockerfiles with Hadolint'

  - script: |
      docker run --rm -v $(Build.SourcesDirectory):/path -w /path zricethezav/gitleaks detect --verbose --redact || true
    displayName: 'Scan for secrets with Gitleaks'

  - script: |
      sudo apt-get update
      sudo apt-get install -y wget apt-transport-https gnupg
      wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
      echo "deb https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
      sudo apt-get update
      sudo apt-get install -y trivy
    displayName: 'Install Trivy'

  # ---- FRONTEND ----
  - script: |
      docker buildx create --use --name multiarch-builder || true
      docker buildx build \
        --no-cache \
        --platform linux/arm64 \
        -f dockerfile.frontend \
        -o type=docker,dest=frontend.tar \
        .
    displayName: 'Build frontend image and export to tar'

  - script: |
      trivy image --severity HIGH,CRITICAL --exit-code 0 --no-progress --input frontend.tar
    displayName: 'Scan frontend image with Trivy'

  - script: |
      docker load < frontend.tar
    displayName: 'Load frontend image from tar'

  - script: |
      IMAGE_ID=$(docker images --format "{{.ID}}" | head -n1)
      docker tag $IMAGE_ID $(dockerId)/$(repoName):frontend-latest
      docker tag $IMAGE_ID $(dockerId)/$(repoName):frontend-$(Build.BuildId)
    displayName: 'Tag frontend image'

  - script: |
      docker push $(dockerId)/$(repoName):frontend-latest
      docker push $(dockerId)/$(repoName):frontend-$(Build.BuildId)
    displayName: 'Push frontend image to Docker Hub'

  # ---- BACKEND ----
  - script: |
      docker buildx create --use --name multiarch-builder || true
      docker buildx build \
        --platform linux/arm64 \
        -f dockerfile.backend \
        -o type=docker,dest=backend.tar \
        .
    displayName: 'Build backend image and export to tar'

  - script: |
      trivy image --severity HIGH,CRITICAL --exit-code 1 --no-progress --input backend.tar
    displayName: 'Scan backend image with Trivy'

  - script: |
      docker load < backend.tar
    displayName: 'Load backend image from tar'

  - script: |
      IMAGE_ID=$(docker images --format "{{.ID}}" | head -n1)
      docker tag $IMAGE_ID $(dockerId)/$(repoName):backend-latest
      docker tag $IMAGE_ID $(dockerId)/$(repoName):backend-$(Build.BuildId)
    displayName: 'Tag backend image'

  - script: |
      docker push $(dockerId)/$(repoName):backend-latest
      docker push $(dockerId)/$(repoName):backend-$(Build.BuildId)
    displayName: 'Push backend image to Docker Hub'
